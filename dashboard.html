<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness dashboard</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#d6dae2; --dim:#8b94a3;
    --idle:#6b7280; --working:#3b82f6; --violet:#8b5cf6; --done:#22c55e;
    --amber:#f59e0b; --red:#ef4444;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
    margin:0 0 8px; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
    border-bottom:1px solid var(--line); }
  #conn { margin-left:auto; color:var(--dim); }
  #banner { display:none; background:var(--done); color:#04210f; font-weight:700;
    padding:10px 16px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:12px; min-width:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .card { background:#12151c; border:1px solid var(--line); border-radius:6px; padding:10px; }
  .card .role { font-weight:700; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px;
    color:#04210f; }
  .card .kv { color:var(--dim); font-size:11px; word-break:break-all; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line);
    white-space:nowrap; }
  td.instr { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:280px; }
  .bar { height:8px; background:#12151c; border:1px solid var(--line); border-radius:5px;
    overflow:hidden; margin:2px 0 6px; }
  .bar > span { display:block; height:100%; background:var(--working); }
  .bar.warn > span { background:var(--amber); }
  .chip { background:var(--amber); color:#04210f; padding:1px 6px; border-radius:10px;
    font-size:11px; font-weight:700; }
  #log { grid-column:1/3; }
  #logbox { height:280px; overflow:auto; background:#0c0e12; border:1px solid var(--line);
    border-radius:6px; padding:8px; }
  #logbox div { white-space:pre-wrap; word-break:break-word; }
  .r { font-weight:700; }
  .muted { color:var(--dim); }
  select { background:#12151c; color:var(--fg); border:1px solid var(--line); border-radius:4px;
    padding:2px 4px; }
  @media (max-width:820px){ main{grid-template-columns:1fr;} #log{grid-column:auto;} }
</style>
</head>
<body>
<header>
  <h1>multi-agent harness</h1>
  <span id="conn">connecting…</span>
</header>
<div id="banner"></div>

<main>
  <section class="panel" style="grid-column:1/3">
    <h2>terminals</h2>
    <div class="grid" id="terminals"></div>
  </section>

  <section class="panel">
    <h2>task queue</h2>
    <div style="overflow:auto"><table id="tasks">
      <thead><tr><th>id</th><th>role</th><th>status</th><th>verdict</th><th>cyc</th>
      <th>age</th><th>instruction</th></tr></thead><tbody></tbody>
    </table></div>
  </section>

  <section class="panel">
    <h2>usage</h2>
    <div id="usage"></div>
  </section>

  <section class="panel" id="log">
    <h2>event log &nbsp; <select id="rolefilter"><option value="">all roles</option></select></h2>
    <div id="logbox"></div>
  </section>
</main>

<script>
const BADGE = {
  idle:'--idle', working:'--working', "in_review":'--violet', revising:'--violet',
  done:'--done', "paused-quota":'--amber',
  blocked:'--red', review_stuck:'--red', review_error:'--red', docs_error:'--red',
};
const ROLE_COLOR = { head:'#eab308', backend:'#3b82f6', frontend:'#06b6d4',
  reviewer:'#8b5cf6', docs:'#22c55e', router:'#f97316', coordinator:'#8b94a3' };

const $ = s => document.querySelector(s);
const esc = s => (s??'').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ago = ts => { if(!ts) return '—'; const d=Date.now()/1000-ts;
  return d<60?`${d|0}s`:d<3600?`${d/60|0}m`:`${d/3600|0}h`; };
const num = n => n==null ? '—' : (typeof n==='number' ? n.toLocaleString() : n);

let renderedIds = new Set(), maxRenderedId = 0, pinned = true;
$('#logbox').addEventListener('scroll', e => {
  const b = e.target; pinned = b.scrollHeight - b.scrollTop - b.clientHeight < 30;
});

async function j(u){ const r = await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }

function renderTerminals(st){
  const names = new Set([...st.terminals.map(t=>t.role), ...st.workers_connected]);
  const byRole = Object.fromEntries(st.terminals.map(t=>[t.role,t]));
  $('#terminals').innerHTML = [...names].sort().map(role => {
    const t = byRole[role] || {status:'(not seen)'};
    const cvar = BADGE[t.status] || '--idle';
    const live = st.workers_connected.includes(role);
    return `<div class="card">
      <div class="role">${esc(role)} ${live?'':'<span class="muted">·offline</span>'}</div>
      <div><span class="badge" style="background:var(${cvar})">${esc(t.status)}</span></div>
      <div class="kv">task ${esc(t.current_task_id)||'—'}</div>
      <div class="kv">sess ${t.current_session_id?esc(t.current_session_id).slice(0,8):'—'}</div>
      <div class="kv">upd ${ago(t.last_updated)}</div>
    </div>`;
  }).join('');
}

function renderTasks(st){
  $('#tasks tbody').innerHTML = st.tasks.map(t => `<tr>
    <td>${esc(t.id)}</td><td>${esc(t.role)}</td><td>${esc(t.status)}</td>
    <td>${esc(t.review_verdict)||'—'}</td><td>${t.review_cycles??0}</td>
    <td>${ago(t.created_at)}</td>
    <td class="instr" title="${esc(t.instruction_text)}">${esc(t.instruction_text)}</td>
  </tr>`).join('') || '<tr><td colspan="7" class="muted">no tasks yet</td></tr>';
}

function bar(val, max){
  const pct = max ? Math.min(100, 100*val/max) : 0;
  return `<div class="bar${pct>=80?' warn':''}"><span style="width:${pct}%"></span></div>`;
}

function renderUsage(u){
  const p = u.by_pool || {};
  const row = (label, body) => `<div style="margin-bottom:8px"><b>${label}</b> ${body}</div>`;
  let html = row('claude'+(u.near_limit?' <span class="chip">NEAR LIMIT</span>':''),
    `<span class="muted">$${(u.cost_usd_5h||0).toFixed(4)} / 5h</span>`)
    + `<div class="muted">calls ${u.calls_5h}/${u.calls_per_5h}</div>${bar(u.calls_5h,u.calls_per_5h)}`
    + `<div class="muted">hours ${u.duration_7d_hours}/${u.duration_hours_per_7d} (7d)</div>${bar(u.duration_7d_hours,u.duration_hours_per_7d)}`;
  const others = [
    ['gemini (reviewer)', p.gemini], ['copilot (docs)', p.copilot], ['router', p.router],
  ];
  for (const [label, d] of others){
    if(!d) continue;
    const bits = [];
    if(d.units!=null) bits.push(`${num(d.units)} ${d.unit_kind||'units'}`);
    if(d.cost_usd!=null) bits.push(`$${d.cost_usd}`);
    bits.push(`${d.calls} call${d.calls===1?'':'s'}`);
    html += row(label, `<span class="muted">${bits.join(' · ')}</span>`);
  }
  $('#usage').innerHTML = html;
}

function renderEvents(evs){
  const box = $('#logbox');
  // coordinator restart -> event ids reset -> our history is stale; clear + rebuild
  if(evs.length && evs[evs.length-1].id < maxRenderedId){
    renderedIds = new Set(); maxRenderedId = 0; box.innerHTML = '';
  }
  const sel = $('#rolefilter');
  const seen = new Set([...sel.options].map(o=>o.value));
  let appended = false;
  for(const e of evs){
    if(renderedIds.has(e.id)) continue;
    renderedIds.add(e.id);
    maxRenderedId = Math.max(maxRenderedId, e.id);
    appended = true;
    if(e.terminal && !seen.has(e.terminal)){
      seen.add(e.terminal);
      sel.add(new Option(e.terminal, e.terminal));
    }
    const t = e.iso ? e.iso.slice(11,19) : '';
    const col = ROLE_COLOR[e.terminal] || 'var(--dim)';
    const d = document.createElement('div');
    d.dataset.role = e.terminal || '';
    d.innerHTML = `<span class="muted">${t}</span> `
      + `<span class="r" style="color:${col}">${esc(e.terminal)||'-'}</span> `
      + `${esc(e.event_type)} <span class="muted">${esc(e.payload_short)}</span>`;
    if(sel.value && sel.value !== e.terminal) d.style.display='none';
    box.appendChild(d);
  }
  while(box.children.length > 400) box.removeChild(box.firstChild);
  if(appended && pinned) box.scrollTop = box.scrollHeight;
}

$('#rolefilter').addEventListener('change', e => {
  const v = e.target.value;
  for(const d of $('#logbox').children) d.style.display = (!v || d.dataset.role===v) ? '' : 'none';
});

async function tick(){
  try {
    const [st, u, evs] = await Promise.all([
      j('/state'), j('/usage'), j('/events?limit=250'),
    ]);
    renderTerminals(st); renderTasks(st); renderUsage(u); renderEvents(evs);
    const b = $('#banner');
    if(st.ready_to_commit){ b.style.display='block';
      b.textContent = 'READY TO COMMIT — ' + (st.ready_to_commit.summary||''); }
    else b.style.display='none';
    $('#conn').textContent = 'live · ' + new Date().toLocaleTimeString();
  } catch(e){ $('#conn').textContent = 'coordinator unreachable'; }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
